name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          # Read-only job: don't leave the token in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Package correctness (publint + are-the-types-wrong)
        run: npm run check:package

      - name: Upload coverage
        if: matrix.node == 24 # active LTS
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  storybook:
    name: Storybook build · Visual regression · a11y
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          # Read-only job: don't leave the token in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Storybook
        run: npm run storybook:build

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Serve Storybook and run test-runner
        # Visual baselines in .storybook/__image_snapshots__ were captured on
        # macOS; Linux font rasterisation can exceed the 2% threshold, so this
        # step reports rather than blocks. Axe a11y violations still surface
        # in the log via axe-playwright.
        continue-on-error: true
        run: |
          # Pre-fetch the one-off CLIs so the background server isn't still
          # downloading when wait-on starts its clock.
          npx --yes http-server --version >/dev/null
          npx --yes wait-on --version >/dev/null
          npx --yes http-server storybook-static --port 6006 --silent &
          npx --yes wait-on tcp:127.0.0.1:6006 --timeout 120000
          npm run test:visual

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: '**/__diff_output__/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Storybook
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7
